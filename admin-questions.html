<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest-admin.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>질문함 - 쉐도잉 챌린지</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }</style>
  <script src="admin-guard.js"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">
<!-- 질문함 (2026-10-29): 학생 질문은 비서가 15분마다 AI 답변을 바로 보내요.
     아주 디테일한 소리 질문·수업 외 문의만 '비서 메모'와 함께 여기 '답 기다림'에 남아요. -->
  <header class="bg-white border-b px-4 py-3 sticky top-0 z-20 shadow-sm">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <a href="admin-students.html" class="text-sm text-gray-400 hover:text-gray-600">← 학생 관리</a>
      <h1 class="text-base font-bold text-gray-900">💬 질문함</h1>
      <div class="w-16"></div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-3 py-5 space-y-4">
    <p class="text-xs text-gray-400">비서가 AI 답변을 바로 보내요. 아래 '답 기다림'은 LJ쌤이 직접 봐야 하는 질문이에요.</p>
    <h2 class="font-bold text-gray-800 text-sm">답 기다림</h2>
    <div id="wait" class="space-y-3"><p class="text-sm text-gray-400">불러오는 중...</p></div>
    <details class="bg-white rounded-2xl shadow-sm p-4"><summary class="text-sm font-bold text-gray-700">답한 질문</summary><div id="done" class="space-y-3 mt-3"></div></details>
  </main>
  <footer class="text-center text-xs font-bold tracking-widest text-blue-600 mt-6">LJ ENGLISH</footer>

<script>
const esc = t => String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function card(id, q) {
  return `<div class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
    <div class="flex justify-between text-sm"><b>${esc(q.name)}</b><span class="text-xs text-gray-400">${q.month || ''} · ${when(q.createdAt)}</span></div>
    <p class="text-sm whitespace-pre-wrap bg-gray-50 rounded-xl p-3">${esc(q.text)}</p>
    ${q.aiDraft && !q.answer ? `<div class="text-sm whitespace-pre-wrap bg-violet-50 rounded-xl p-3"><span class="text-xs text-violet-500">🤖 비서 메모·초안 (학생에게는 안 보여요)</span><br>${esc(q.aiDraft)}</div>` : ''}
    <textarea data-id="${id}" rows="4" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm" placeholder="답변">${esc(q.answer || '')}</textarea>
    <button data-save="${id}" class="bg-blue-600 text-white text-sm font-bold rounded-xl px-4 py-2">${q.answer ? '고쳐서 저장' : '답변 보내기'}</button></div>`;
}
async function load() {
  const snap = await db.collection('shadowingQuestions').get();
  const all = snap.docs.map(d => [d.id, d.data()]).sort((a, b) => b[1].createdAt - a[1].createdAt);
  const wait = all.filter(([, q]) => !q.answer), done = all.filter(([, q]) => q.answer).slice(0, 50);
  document.getElementById('wait').innerHTML = wait.length ? wait.map(([id, q]) => card(id, q)).join('') : '<p class="text-sm text-gray-400">답 기다리는 질문이 없어요</p>';
  document.getElementById('done').innerHTML = done.map(([id, q]) => card(id, q)).join('') || '<p class="text-sm text-gray-400">아직 없어요</p>';
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.dataset.save, a = document.querySelector(`textarea[data-id="${id}"]`).value.trim();
    b.disabled = true;
    await db.collection('shadowingQuestions').doc(id).update({ answer: a, answeredAt: a ? Date.now() : null });
    load();
  });
}
load();
</script>
</body>
</html>
