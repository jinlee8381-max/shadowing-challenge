acity,1))}.text-red-500{--tw-text-opacity:1;color:rgb(239 68 68/var(--tw-text-opacity,1))}.text-white{--tw-text-opacity:1;color:rgb(255 255 255/var(--tw-text-opacity,1))}.opacity-35{opacity:.35}.shadow-sm{--tw-shadow:0 1px 2px 0 rgba(0,0,0,.05);--tw-shadow-colored:0 1px 2px 0 var(--tw-shadow-color);box-shadow:var(--tw-ring-offset-shadow,0 0 #0000),var(--tw-ring-shadow,0 0 #0000),var(--tw-shadow)}.grayscale{--tw-grayscale:grayscale(100%)}.filter,.grayscale{filter:var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow)}.transition-colors{transition-property:color,background-color,border-color,text-decoration-color,fill,stroke;transition-timing-function:cubic-bezier(.4,0,.2,1);transition-duration:.15s}.hover\:bg-orange-500:hover{--tw-bg-opacity:1;background-color:rgb(249 115 22/var(--tw-bg-opacity,1))}.hover\:text-white:hover{--tw-text-opacity:1;color:rgb(255 255 255/var(--tw-text-opacity,1))}</style>

    .dot-done   { background:#22c55e; color:#fff; }
    .dot-miss   { background:#e5e7eb; color:#9ca3af; }

<body class="bg-gray-50 min-h-screen">
  <div class="sticky top-0 z-30">
    <p class="bg-gray-800 text-white text-sm font-bold text-center px-4 py-2">특강 시연용 · 실제 수강생의 11월 기록 (이름은 가렸어요)</p>
    <header class="bg-white border-b px-4 py-3 shadow-sm">
      <div class="max-w-lg mx-auto flex items-center gap-2">
        <span class="text-xl">🎙️</span>
        <div>
          <h1 class="text-base font-bold text-gray-900">송○○</h1>
          <p class="text-xs text-gray-400">쉐도잉 챌린지 · 11월</p>
        </div>
      </div>
    </header>
  </div>
  <main class="max-w-lg mx-auto px-3 py-5 pb-10 space-y-4">
      <!-- 주차별 현황 -->
      <div class="bg-white rounded-2xl shadow-sm p-4 space-y-3">
        <h2 class="font-bold text-gray-800 text-sm">내 챌린지 현황</h2>
        <div class="grid grid-cols-4 gap-2" id="myWeekSummary"></div>

        <!-- 이번 주 상세 -->
        <div class="pt-2 border-t border-gray-100">
          <p class="text-xs text-gray-400 mb-2" id="weekDetailLabel">이번 주 · 7일 중 5일 인증</p>
          <div class="flex gap-1" id="myWeek3Days"></div>
        </div>
      </div>

      <!-- 연속 인증 streak -->
      <div class="bg-white rounded-2xl shadow-sm p-4">
        <div class="flex items-center gap-3">
          <div class="flex-shrink-0 w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-2xl">🔥</div>
          <div class="flex-1">
            <p class="font-bold text-gray-800"><span id="streakCount">0</span>일 연속 인증 중!</p>
            <p class="text-xs text-gray-400 mt-0.5">최고 기록: <span id="bestStreak">0</span>일 &nbsp;·&nbsp; 계속 유지해요 💪</p>
          </div>
          <div class="text-right flex-shrink-0">
            <p class="text-xs text-gray-400 mb-0.5">총 인증</p>
            <p class="text-2xl font-bold text-blue-600" id="totalCount">0</p>
            <p class="text-xs text-gray-400">회</p>
          </div>
        </div>
        <div class="mt-3 flex gap-1" id="streakMiniBar"></div>
      </div>

      <!-- 획득한 뱃지 -->
      <div class="bg-white rounded-2xl shadow-sm p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-gray-800 text-sm">획득한 뱃지</h2>
        </div>
        <div class="flex flex-wrap gap-x-3 gap-y-3 pb-1" id="myBadges"></div>
        <p class="text-xs text-gray-400 mt-2" id="badgeMsg"></p>
      </div>

      <!-- 최근 피드백 -->
      <div class="bg-white rounded-2xl shadow-sm p-4 space-y-3">
        <h2 class="font-bold text-gray-800 text-sm">최근 선생님 피드백</h2>
        <div id="recentFeedback" class="space-y-2">
          <p class="text-sm text-gray-400 text-center py-3">로딩 중...</p>
        </div>
      </div>

      <footer class="text-center text-xs font-bold tracking-widest text-blue-600 pt-2">LJ ENGLISH</footer>
  </main>
  <script>
  // 시연용: 저장·통신 없음. 시간은 11/25(수) 낮으로 멈춰 둠
  const RealDate = Date, NOW = new RealDate(2026, 10, 25, 12, 0, 0).getTime();
  window.Date = class extends RealDate { constructor(...a) { if (a.length) super(...a); else super(NOW); } static now() { return NOW; } };
  const START = '2026-11-02', DOW_LABELS = ['월','화','수','목','금','토','일'];
  let currentWeek = 4;
  const toLocalDateStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayStr = () => toLocalDateStr(new Date());
  const tsToDateKey = t => t ? toLocalDateStr(new Date(t)) : '';
  const tsToMD = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; };
  function getWeekDates(w) { const s = new Date(START + 'T00:00:00'); return Array.from({length:7}, (_, i) => { const d = new Date(s); d.setDate(s.getDate() + (w-1)*7 + i); return toLocalDateStr(d); }); }

  // ↓↓↓ 실제 어플(my-page.html)에서 그대로 가져온 그리기 함수
  function renderWeekSummary(subs) {
      const el = document.getElementById('myWeekSummary');
      el.innerHTML = '';
      [1,2,3,4].forEach(w => {
        const count = subs.filter(s => s.week === w).length;
        const isCurrent = w === currentWeek;
        const isFuture  = w > currentWeek;
        const success   = count >= 5;
        let color, text;
        if (isFuture) {
          color = 'bg-gray-50 border border-gray-200';
          text  = `<span class="text-gray-400 text-sm">-</span>`;
        } else if (isCurrent) {
          color = 'bg-blue-50 border border-blue-200';
          text  = `<span class="text-blue-600 font-bold text-base">${count}/5</span>`;
        } else if (success) {
          color = 'bg-green-50 border border-green-200';
          text  = `<span class="text-green-600 font-bold text-xl">O</span>`;
        } else {
          color = 'bg-red-50 border border-red-200';
          text  = `<span class="text-red-500 font-bold text-xl">X</span>`;
        }
        el.innerHTML += `
          <div class="${color} rounded-xl p-2 text-center">
            <p class="text-xs text-gray-500 font-medium mb-1">${w}주</p>
            <div class="flex justify-center items-center h-7">${text}</div>
          </div>
        `;
      });
    }

function renderWeekDots(subs) {
      const daysEl  = document.getElementById('myWeek3Days');
      const today   = todayStr();
      const weekDates = getWeekDates(currentWeek);
      daysEl.innerHTML = '';
      weekDates.forEach((dateStr, i) => {
        const submitted = subs.some(s => tsToDateKey(s.submittedAt) === dateStr);
        let cls, sym;
        if (dateStr > today)        { cls = 'dot-future'; sym = '·'; }
        else if (dateStr === today) { cls = submitted ? 'dot-done' : 'dot-today'; sym = submitted ? '●' : '▶'; }
        else                        { cls = submitted ? 'dot-done' : 'dot-miss';  sym = submitted ? '●' : '○'; }
        const [,dm,dd] = dateStr.split('-');
        daysEl.innerHTML += `
          <div class="flex-1 text-center">
            <p class="text-xs text-gray-400 mb-1">${DOW_LABELS[i]}</p>
            <span class="${cls} inline-flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold mx-auto block">${sym}</span>
            <p class="text-xs text-gray-400 mt-1">${parseInt(dm)}/${parseInt(dd)}</p>
          </div>
        `;
      });
    }

function calcStreak(subs) {
      // 제출 날짜를 정렬하여 연속 일수 계산
      const dates = [...new Set(subs.map(s => tsToDateKey(s.submittedAt)).filter(Boolean))].sort();
      if (dates.length === 0) return { streak: 0, best: 0 };

      let streak = 1, best = 1, cur = 1;
      for (let i = 1; i < dates.length; i++) {
        const prev = new Date(dates[i-1]);
        const curr = new Date(dates[i]);
        const diff = Math.round((curr - prev) / 86400000);
        if (diff === 1) { cur++; best = Math.max(best, cur); }
        else { cur = 1; }
      }
      // 현재 연속: 마지막 날짜가 오늘 또는 어제인 경우만 유효
      const lastDate = new Date(dates[dates.length - 1]);
      const today2   = new Date(); today2.setHours(0,0,0,0);
      const diffFromToday = Math.round((today2 - lastDate) / 86400000);
      if (diffFromToday <= 1) streak = cur;
      else streak = 0;

      return { streak, best };
    }

function renderStreak(subs) {
      const { streak, best } = calcStreak(subs);
      document.getElementById('streakCount').textContent = streak;
      document.getElementById('bestStreak').textContent  = best;
      document.getElementById('totalCount').textContent  = subs.length;

      // 미니 바 (최근 14일)
      const bar   = document.getElementById('streakMiniBar');
      const today = todayStr();
      bar.innerHTML = '';
      for (let i = 13; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const key  = d.toISOString().slice(0,10);
        const done = subs.some(s => tsToDateKey(s.submittedAt) === key);
        const isToday = key === today;
        const color = isToday ? 'bg-blue-400' : done ? 'bg-orange-400' : 'bg-gray-100';
        bar.innerHTML += `<div class="flex-1 h-1.5 rounded-full ${color}"></div>`;
      }
    }

function renderBadges(subs, hasReflection = false) {
      const { streak, best } = calcStreak(subs);
      const weekSuccesses = [1,2,3,4].map(w => subs.filter(s=>s.week===w).length >= 5);
      const allBadges = [
        { emoji:'🌱', name:'시작의 씨앗',    earned: subs.length >= 1 },
        { emoji:'⭐', name:'1주 완주',       earned: weekSuccesses[0] },
        { emoji:'🌟', name:'2주 완주',       earned: weekSuccesses[1] },
